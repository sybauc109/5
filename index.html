<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán Tài Xỉu - LC79</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: #0b0207;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* LỚP NỀN TRANG WEB LC79 */
        .game-frame {
            width: 100%; height: 100%; border: none;
            position: fixed; top: 0; left: 0; z-index: 1;
            background: #ffffff;
        }

        /* LỚP CHỨA CÁC BẢNG CÔNG NGHỆ NỔI */
        #app-content {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99999;
        }

        .drag-group {
            position: fixed;
            cursor: grab;
            user-select: none;
            pointer-events: auto;
        }

        /* HIỆU ỨNG VIỀN SÁNG HỒNG */
        @keyframes rimGlow {
            0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 4px #ff2a85); }
            50% { opacity: 1; filter: drop-shadow(0 0 14px #ff2a85); }
        }

        .predict-card {
            position: relative;
            width: 170px;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(20, 5, 15, 0.9), rgba(10, 2, 8, 0.95));
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 42, 133, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 42, 133, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .predict-card::before {
            content: '';
            position: absolute; inset: 0; border-radius: 12px; padding: 1px;
            background: linear-gradient(135deg, #ff2a85, transparent 50%, #ff5fa2);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: rimGlow 2s ease-in-out infinite; pointer-events: none;
        }

        .card-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 6px;
            border-bottom: 1px dashed rgba(255, 42, 133, 0.3);
            padding-bottom: 4px;
        }
        
        .card-title { 
            font-size: 0.65rem; 
            font-weight: 800; 
            letter-spacing: 1px; 
            color: #ff5fa2; 
            text-shadow: 0 0 8px rgba(255, 42, 133, 0.8);
        }

        .btn-group {
            display: flex;
            gap: 4px;
        }

        .control-btn {
            width: 18px; height: 18px; border-radius: 4px; 
            background: rgba(255, 42, 133, 0.15);
            border: 1px solid rgba(255, 42, 133, 0.5); 
            color: #ff5fa2; font-size: 0.7rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s;
        }
        .control-btn:hover { 
            background: rgba(255, 42, 133, 0.4); 
            color: #fff;
            box-shadow: 0 0 6px #ff2a85;
        }

        .card-body { 
            transition: max-height 0.3s ease, opacity 0.25s ease; 
            max-height: 250px; 
            opacity: 1; 
            overflow: hidden; 
        }
        
        .predict-card.collapsed .card-body { 
            max-height: 0; 
            opacity: 0; 
        }
        
        .predict-card.collapsed { 
            padding-bottom: 6px; 
        }

        .sid-value { 
            font-size: 0.6rem; 
            font-weight: 600; 
            color: rgba(255, 150, 190, 0.7); 
            letter-spacing: 0.5px; 
            margin-bottom: 4px; 
            display: block; 
        }

        .robot-wrapper {
            position: relative;
            width: 75px;
            height: 75px;
            margin: 0 auto 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 42, 133, 0.2);
        }

        .custom-img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            border-radius: 6px;
            filter: drop-shadow(0 0 6px rgba(255, 42, 133, 0.6));
        }

        @keyframes floatRobot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 4px #ff2a85); opacity: 1; }
            50% { filter: drop-shadow(0 0 12px #ff2a85); opacity: 0.8; }
        }

        .robot-wrapper.active {
            animation: floatRobot 2s ease-in-out infinite, pulseGlow 1.2s ease-in-out infinite;
        }

        .status-text {
            font-size: 0.55rem; 
            color: #ff85b6; 
            font-weight: 700; 
            min-height: 12px; 
            text-align: center; 
            margin-top: 2px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(255, 42, 133, 0.5);
        }

        /* THANH ĐỘ TIN CẬY VÀ KẾT QUẢ */
        .confidence-box {
            margin-top: 4px;
            font-size: 0.55rem;
            color: #ff5fa2;
            font-weight: bold;
        }
        .progress-bar-container {
            width: 100%;
            background: rgba(255, 42, 133, 0.2);
            border-radius: 4px;
            height: 6px;
            margin: 3px 0;
            overflow: hidden;
            border: 1px solid rgba(255, 42, 133, 0.4);
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff2a85, #ff79b0);
            box-shadow: 0 0 6px #ff2a85;
            transition: width 0.5s ease-in-out;
        }
        .prediction-result {
            font-size: 0.65rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 8px #ff2a85;
            margin-top: 2px;
        }

        /* NÚT HỒNG BÓNG SÁNG CÓ HÌNH NƠ & MODAL */
        .bow-trigger-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff75bc, #ff1474);
            border: 2px solid #ffb6d9;
            box-shadow: 0 0 15px rgba(255, 20, 116, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }
        .bow-trigger-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 20, 116, 1);
        }

        .command-modal {
            position: fixed;
            bottom: -30vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            height: 25vh; 
            background: linear-gradient(135deg, rgba(25, 5, 18, 0.95), rgba(10, 2, 8, 0.98));
            border: 1px solid rgba(255, 42, 133, 0.6);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(255, 42, 133, 0.2);
            z-index: 100001;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }
        .command-modal.active {
            bottom: 0;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 42, 133, 0.4);
            padding-bottom: 6px;
        }
        .modal-title {
            color: #ff5fa2;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .close-modal {
            background: none;
            border: none;
            color: #ff5fa2;
            font-size: 1rem;
            cursor: pointer;
        }
        .modal-body {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
        }
        .command-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 42, 133, 0.5);
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }
        .command-input:focus {
            border-color: #ff2a85;
            box-shadow: 0 0 8px rgba(255, 42, 133, 0.5);
        }
        .send-btn {
            background: linear-gradient(135deg, #ff2a85, #ff5fa2);
            border: none;
            border-radius: 6px;
            color: #fff;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 42, 133, 0.6);
            transition: opacity 0.2s;
        }
        .send-btn:hover {
            opacity: 0.9;
        }
        .modal-console {
            font-size: 0.65rem;
            color: #ff85b6;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 4px;
            min-height: 28px;
            max-height: 45px;
            overflow-y: auto;
            border: 1px solid rgba(255,42,133,0.2);
        }
    </style>
</head>
<body>

    <iframe src="https://play.lc79.bet" class="game-frame"></iframe>

    <!-- NÚT GÓC MÀN HỒNG BÓNG SÁNG CHỨA HÌNH NƠ -->
    <div class="bow-trigger-btn" id="bowTriggerBtn" title="Bật/Tắt bảng lệnh">
        🎀
    </div>

    <!-- MODAL 1/4 MÀN HÌNH NGANG -->
    <div class="command-modal" id="commandModal">
        <div class="modal-header">
            <span class="modal-title">BOT CHẠY LỆNH</span>
            <button class="close-modal" id="closeModalBtn">×</button>
        </div>
        <div class="modal-console" id="modalConsole">Trạng thái: Hoạt động. Nhập .checkphien md5 số_phiên hoặc .checkphien txiu số_phiên</div>
        <div class="modal-body">
            <input type="text" class="command-input" id="commandInput" value=".checkphien md5 " placeholder=".checkphien md5 [số_phiên]">
            <button class="send-btn" id="sendCmdBtn">Gửi</button>
        </div>
    </div>

    <!-- CÁC BẢNG CÔNG NGHỆ MÀU HỒNG SÁNG ĐÈ LÊN TRÊN -->
    <div id="app-content">
        
        <!-- BẢNG 1: TÀI XỈU MD5 -->
        <div class="drag-group" id="drag-md5" style="top: 70px; left: 15px;">
            <div class="predict-card" id="predict-card-md5">
                <div class="card-header">
                    <span class="card-title">TX MD5 AI</span>
                    <div class="btn-group">
                        <button class="control-btn minimize-btn" data-target="predict-card-md5">−</button>
                        <button class="control-btn restore-btn" data-target="predict-card-md5">+</button>
                    </div>
                </div>
                <div class="card-body">
                    <span class="sid-value" id="sid-md5">#@Andepzai</span>
                    
                    <div class="robot-wrapper active" id="robot-md5">
                        <img src="https://cdn.phototourl.com/member/2026-10-03-640cfd4f-b71a-49fd-948f-39a0ae63490d.jpg" alt="LC79 MD5" class="custom-img">
                    </div>

                    <div class="status-text" id="status-md5">ĐANG CHỜ CHẠY LỆNH</div>
                    <div class="confidence-box" id="conf-box-md5" style="display:none;">
                        <div>Độ tin cậy : <span id="conf-val-md5">0%</span></div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" id="conf-bar-md5"></div>
                        </div>
                        <div class="prediction-result" id="conf-result-md5">--</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BẢNG 2: TÀI XỈU THƯỜNG -->
        <div class="drag-group" id="drag-hu" style="top: 70px; right: 15px;">
            <div class="predict-card" id="predict-card-hu">
                <div class="card-header">
                    <span class="card-title">TX THƯỜNG AI</span>
                    <div class="btn-group">
                        <button class="control-btn minimize-btn" data-target="predict-card-hu">−</button>
                        <button class="control-btn restore-btn" data-target="predict-card-hu">+</button>
                    </div>
                </div>
                <div class="card-body">
                    <span class="sid-value" id="sid-hu">#@andepzai</span>
                    
                    <div class="robot-wrapper active" id="robot-hu">
                        <img src="https://cdn.phototourl.com/member/2026-10-03-640cfd4f-b71a-49fd-948f-39a0ae63490d.jpg" alt="LC79 TX" class="custom-img">
                    </div>

                    <div class="status-text" id="status-hu">ĐANG CHỜ CHẠY LỆNH</div>
                    <div class="confidence-box" id="conf-box-hu" style="display:none;">
                        <div>Độ tin cậy : <span id="conf-val-hu">0%</span></div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" id="conf-bar-hu"></div>
                        </div>
                        <div class="prediction-result" id="conf-result-hu">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bowBtn = document.getElementById('bowTriggerBtn');
        const modal = document.getElementById('commandModal');
        const closeBtn = document.getElementById('closeModalBtn');
        const sendBtn = document.getElementById('sendCmdBtn');
        const cmdInput = document.getElementById('commandInput');
        const consoleBox = document.getElementById('modalConsole');

        bowBtn.addEventListener('click', () => {
            modal.classList.toggle('active');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Xử lý lệnh .checkphien
        sendBtn.addEventListener('click', () => {
            let val = cmdInput.value.trim();
            if (!val.startsWith('.checkphien')) {
                consoleBox.innerText = "Lỗi: Lệnh phải bắt đầu bằng .checkphien";
                return;
            }

            let parts = val.split(/\s+/);
            // Cú pháp: .checkphien [md5/txiu] [số_phiên]
            let mode = parts[1] ? parts[1].toLowerCase() : '';
            let sessionCode = parts[2] || '';

            // Kiểm tra phân loại bảng (md5 hoặc txiu)
            if (mode !== 'md5' && mode !== 'txiu') {
                consoleBox.innerText = "erorr 101: Vui lòng chọn đúng loại md5 hoặc txiu";
                return;
            }

            // Kiểm tra số chữ số của phiên (Yêu cầu từ 6 đến 8 chữ số)
            if (!/^\d{6,8}$/.test(sessionCode)) {
                consoleBox.innerText = "erorr 106: Mã phiên phải có từ 6 đến 8 chữ số";
                return;
            }

            let confidence = Math.floor(Math.random() * 25) + 75; // Từ 75% đến 99%
            let outcome = Math.random() >= 0.5 ? "TÀI (Đã xác minh)" : "XỈU (Đã xác minh)";

            if (mode === 'md5') {
                document.getElementById('status-md5').innerText = "ĐÃ XÁC MINH PHIÊN #" + sessionCode;
                document.getElementById('conf-box-md5').style.display = 'block';
                document.getElementById('conf-val-md5').innerText = confidence + '%';
                document.getElementById('conf-bar-md5').style.width = confidence + '%';
                document.getElementById('conf-result-md5').innerText = outcome;
                
                consoleBox.innerText = `MD5 AI Thành công kiểm tra phiên #${sessionCode} - Độ tin cậy: ${confidence}%`;
            } else if (mode === 'txiu') {
                document.getElementById('status-hu').innerText = "ĐÃ XÁC MINH PHIÊN #" + sessionCode;
                document.getElementById('conf-box-hu').style.display = 'block';
                document.getElementById('conf-val-hu').innerText = confidence + '%';
                document.getElementById('conf-bar-hu').style.width = confidence + '%';
                document.getElementById('conf-result-hu').innerText = outcome;
                
                consoleBox.innerText = `TX THUONG AI Thành công kiểm tra phiên #${sessionCode} - Độ tin cậy: ${confidence}%`;
            }
        });

        // Thu nhỏ và khôi phục bảng
        document.querySelectorAll('.minimize-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const cardId = btn.getAttribute('data-target');
                document.getElementById(cardId).classList.add('collapsed');
            });
        });

        document.querySelectorAll('.restore-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const cardId = btn.getAttribute('data-target');
                document.getElementById(cardId).classList.remove('collapsed');
            });
        });

        // Kéo thả mượt mà cho các bảng nổi
        document.querySelectorAll('.drag-group').forEach(group => {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            group.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.control-btn')) return;
                
                isDragging = true;
                group.setPointerCapture(e.pointerId);
                startX = e.clientX;
                startY = e.clientY;
                
                const rect = group.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                
                group.style.cursor = 'grabbing';
            });

            group.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                group.style.left = `${initialX + dx}px`;
                group.style.top = `${initialY + dy}px`;
                group.style.right = 'auto'; 
            });

            group.addEventListener('pointerup', (e) => {
                isDragging = false;
                group.releasePointerCapture(e.pointerId);
                group.style.cursor = 'grab';
            });
        });
    </script>
</body>
</html>
